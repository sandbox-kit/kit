version: 1
provider: daytona
error_statuses: {400: invalid_argument, 401: authentication, 403: permission_denied, 404: not_found, 408: timeout, 409: conflict, 412: failed_precondition, 422: invalid_argument, 429: rate_limited, 500: internal, 502: unavailable, 503: unavailable, 504: timeout}
errors:
  go:
    target:
      import: github.com/daytona/clients/sdk-go/pkg/errors
      name: DaytonaError
      fields: {status: StatusCode, code: Code, source: Source}
checks:
  - {path: runtime.language, allowed: [python, javascript, typescript]}
  - {path: network.outbound_proxy_url, format: http_url}
  - {path: network.outbound_cidrs.entries, format: cidr}
  - {path: network.outbound_domains.entries, format: domain}
  - {path: security.secrets.environment_variable, format: env_name}
  - {exclusive_policies: [idle_stop, idle_pause]}
  - {path: idle_pause, forbid_policy_with: ephemeral}
  - {path: idle_pause, forbid_policy_with: stopped_delete}
  - {path: stopped_delete, forbid_policy_with: ephemeral}
  - {path: stopped_archive, forbid_policy_with: ephemeral}
client:
  target:
    name: DaytonaConfig
    bindings:
      go: {import: github.com/daytona/clients/sdk-go/pkg/types, name: DaytonaConfig}
  environment:
    - {field: endpoint, variables: [DAYTONA_API_URL, DAYTONA_SERVER_URL], default: "https://app.daytona.io/api"}
  settings: mapClientSettings
  managed: [provider, timeout]
  scope: {field: scope, group: mapScope}
  auth:
    - {field: api_key, group: mapAPIKeyCredentials}
    - {field: bearer_token, group: mapBearerAuth}
runtime:
  go:
    constructor: {function: NewClientWithConfig}
    cleanup: {method: Close, accepts_context: true, returns_error: true}
groups:
  - name: mapLifetimePolicies
    direction: request
    source: {name: LifetimePolicy}
    target:
      name: SandboxBaseParams
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: SandboxBaseParams
          fields: {stop: AutoStopInterval, pause: AutoPauseInterval, archive: AutoArchiveInterval, delete: AutoDeleteInterval}
    fields:
      - {from: idle_stop, to: stop, transform: policy_minutes, policy: {disabled: zero, immediate: false}}
      - {from: idle_pause, to: pause, transform: policy_minutes, policy: {disabled: zero, immediate: false}}
      - {from: stopped_archive, to: archive, transform: policy_minutes, maximum: 43200, policy: {disabled: reject, immediate: false}}
      - {from: stopped_delete, to: delete, transform: policy_minutes, policy: {disabled: reject, immediate: true}}
  - name: mapCommonCreateFields
    direction: request
    source: {name: CreateOptions}
    target:
      name: SandboxBaseParams
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: SandboxBaseParams
          fields: {name: Name, environment: EnvVars, labels: Labels}
    fields:
      - {from: name, to: name}
      - {from: environment, to: environment}
      - {from: labels, to: labels}
  - name: mapResources
    direction: request
    source: {name: Resources}
    target:
      name: Resources
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: Resources
          fields: {cpu: CPU, memory: Memory, disk: Disk}
    fields:
      - {from: cpu_cores, to: cpu, transform: whole, maximum: 2147483647, cast: integer}
      - {from: memory_mib, to: memory, transform: divide_exactly, factor: 1024, maximum: 2147483647, cast: integer}
      - {from: disk_mib, to: disk, transform: divide_exactly, factor: 1024, maximum: 2147483647, cast: integer}
  - name: mapSandboxInfo
    origin: provider
    direction: response
    source:
      name: Sandbox
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/daytona
          name: Sandbox
          fields: {id: ID, name: Name, state: State, region: Target, labels: Labels}
    target: {name: SandboxInfo}
    fields:
      - {from: id, to: id}
      - {from: name, to: name}
      - {from: state, to: provider_state, cast: string}
      - {from: region, to: region}
      - {from: labels, to: labels}
  - name: mapAllocatedResources
    direction: response
    when:
      - {field: cpu, greater_than: 0}
      - {field: memory, greater_than: 0}
      - {field: disk, greater_than: 0}
    source:
      name: Sandbox
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/daytona
          name: Sandbox
          fields: {cpu: Cpu, memory: Memory, disk: Disk}
    target: {name: Resources}
    fields:
      - {from: cpu, to: cpu_cores, cast: number}
      - {from: memory, to: memory_mib, transform: multiply, factor: 1024}
      - {from: disk, to: disk_mib, transform: multiply, factor: 1024}
  - name: mapClientSettings
    direction: request
    source: {name: Config}
    target:
      name: DaytonaConfig
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: DaytonaConfig
          fields: {endpoint: APIUrl, region: Target}
    fields:
      - {from: endpoint, to: endpoint}
      - {from: region, to: region}
  - name: mapAPIKeyCredentials
    direction: request
    source: {name: APIKeyCredentials}
    target:
      name: DaytonaConfig
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: DaytonaConfig
          fields: {key: APIKey}
    fields:
      - {from: key, to: key}
  - name: mapBearerAuth
    direction: request
    source: {name: BearerTokenCredentials}
    target:
      name: DaytonaConfig
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: DaytonaConfig
          fields: {token: JWTToken}
    fields:
      - {from: token, to: token}
  - name: mapScope
    direction: request
    source: {name: Scope}
    target:
      name: DaytonaConfig
      bindings:
        go:
          import: github.com/daytona/clients/sdk-go/pkg/types
          name: DaytonaConfig
          fields: {organization_id: OrganizationID}
    fields:
      - {from: organization_id, to: organization_id}
