version: 1
provider: blaxel
# Provider create checks are handwritten in sdks/*/providers/blaxel (provider_checks).
# Keep this list in sync with those implementations; it is not emitted.
checks:
  - { path: name, required: true }
  - { path: source.image, required: true }
  - { path: placement, unsupported: true }
  - { path: resources.cpu_cores, unsupported: true }
  - { path: resources.cpu_limit_cores, unsupported: true }
  - { path: resources.memory_limit_mib, unsupported: true }
  - { path: resources.disk_mib, unsupported: true }
client:
  target:
    name: ClientOptions
    bindings:
      go:
        {
          import: github.com/blaxel-ai/sdk-go/option,
          name: RequestOption,
        }
      typescript: { import: "@blaxel/core", name: ClientOptions }
  managed: [provider, timeout]
  retained: [region]
  rejected:
    {
      endpoint: "Endpoint cannot be configured through this SDK's public client constructor",
    }
  scope: { field: scope, group: mapClientScope, retained: [workspace] }
  auth:
    - { field: api_key, group: mapAPIKeyCredentials }
runtime:
  go:
    constructor: { function: NewClient }
    state:
      - {
          name: region,
          type: string,
          optional: true,
          capture: region,
          doc: "is the captured default region. Nil means the caller omitted it; create requires a region.",
        }
    cleanup: { method: Close, accepts_context: true, returns_error: false }
  typescript:
    constructor: { function: BlaxelApiClient }
    state:
      - {
          name: region,
          type: string,
          optional: true,
          capture: region,
          doc: "is the captured default region. Omission means create rejects with Config.region required.",
        }
    cleanup:
      { method: close, accepts_context: false, returns_error: false }
# Mapping groups are handwritten in sdks/*/providers/blaxel (provider_mappings).
# Keep this inventory in sync with those implementations; it is not emitted.
groups:
  - name: mapClientScope
    direction: request
    source: { name: Scope }
    target:
      name: ClientOptions
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go/option
          name: RequestOption
          fields: { workspace: WithWorkspace }
        typescript:
          import: "@blaxel/core"
          name: ClientOptions
          fields: { workspace: workspace }
    fields:
      - { from: workspace, to: workspace }
  - name: mapAPIKeyCredentials
    direction: request
    source: { name: APIKeyCredentials }
    target:
      name: ClientOptions
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go/option
          name: RequestOption
          fields: { key: WithAPIKey }
        typescript:
          import: "@blaxel/core"
          name: ClientOptions
          fields: { key: apiKey }
    fields:
      - { from: key, to: key }
  - name: mapCommonCreateFields
    direction: request
    source: { name: CreateOptions }
    target:
      name: SandboxNewParams
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: SandboxNewParams
          fields:
            {
              name: Sandbox.Metadata.Name,
              environment: Sandbox.Spec.Runtime.Envs,
              labels: Sandbox.Metadata.Labels,
            }
        typescript:
          import: "@blaxel/core"
          name: SandboxCreateRequest
          fields:
            {
              name: metadata.name,
              environment: spec.runtime.envs,
              labels: metadata.labels,
            }
    fields:
      - { from: name, to: name }
      - { from: environment, to: environment }
      - { from: labels, to: labels }
  - name: mapResources
    direction: request
    source: { name: Resources }
    target:
      name: SandboxNewParams
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: SandboxNewParams
          fields: { memory: Sandbox.Spec.Runtime.Memory }
        typescript:
          import: "@blaxel/core"
          name: SandboxCreateRequest
          fields: { memory: spec.runtime.memory }
    fields:
      - {
          from: memory_mib,
          to: memory,
          maximum: 2147483647,
          cast: integer,
        }
  - name: mapLifetimeDuration
    direction: request
    source: { name: LifetimePolicy }
    target:
      name: SandboxNewParams
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: SandboxNewParams
          fields: { ttl: Sandbox.Spec.Runtime.Ttl }
        typescript:
          import: "@blaxel/core"
          name: SandboxCreateRequest
          fields: { ttl: spec.runtime.ttl }
    fields:
      - {
          from: maximum_lifetime,
          to: ttl,
          transform: duration_blaxel,
        }
  - name: mapIdleDuration
    error_path: lifetime.idle_terminate
    direction: request
    source: { name: AutomaticAction }
    target:
      name: SandboxNewParams
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: SandboxNewParams
          fields: { lifecycle: Sandbox.Spec.Lifecycle.ExpirationPolicies }
        typescript:
          import: "@blaxel/core"
          name: SandboxCreateRequest
          fields: { lifecycle: spec.lifecycle.expirationPolicies }
    fields:
      - {
          from: after,
          to: lifecycle,
          transform: duration_blaxel_idle,
        }
  - name: mapSandboxInfo
    direction: response
    source:
      name: Sandbox
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: Sandbox
          fields:
            {
              id: Metadata.Name,
              name: Metadata.Name,
              state: Status,
              region: Spec.Region,
              labels: Metadata.Labels,
            }
        typescript:
          import: "@blaxel/core"
          name: Sandbox
          fields:
            {
              id: metadata.name,
              name: metadata.name,
              state: status,
              region: spec.region,
              labels: metadata.labels,
            }
    target: { name: SandboxInfo }
    fields:
      - { from: id, to: id }
      - { from: name, to: name }
      - { from: state, to: provider_state, cast: string }
      - { from: region, to: region }
      - { from: labels, to: labels }
  - name: mapAllocatedResources
    direction: response
    when:
      - { field: memory, greater_than: 0 }
    source:
      name: Sandbox
      bindings:
        go:
          import: github.com/blaxel-ai/sdk-go
          name: Sandbox
          fields: { memory: Spec.Runtime.Memory }
        typescript:
          import: "@blaxel/core"
          name: Sandbox
          fields: { memory: spec.runtime.memory }
    target: { name: Resources }
    fields:
      - { from: memory, to: memory_mib, cast: number }
