# Signature requirements for helper templates still consumed by Kit emitters.
# Client/handle/provider orchestration and shared create validation are
# handwritten and are not checked here.
version: 1
signatures:
  provider_checks:
    owner: function
    params:
      - id: request
        type:
          ref: request
          nullable: true
          reference: true
    fallible: true
    cancellable: false
  request_mapping:
    owner: function
    params:
      - id: source
        type:
          ref: source
          nullable: true
          reference: true
    results:
      - type:
          ref: target
      - type:
          ref: source
    fallible: true
    cancellable: false
  response_mapping:
    owner: function
    params:
      - id: source
        type:
          ref: source
          nullable: true
          reference: true
    results:
      - type:
          ref: target
    fallible: true
    cancellable: false
