# Signature requirements for helper templates still consumed by Kit emitters.
# Client/handle/provider orchestration, shared create validation, and provider
# checks are handwritten and are not checked here.
version: 1
signatures:
  request_mapping:
    owner: function
    params:
      - id: source
        type:
          ref: source
          nullable: true
          reference: true
    results:
      - type:
          ref: target
      - type:
          ref: source
    fallible: true
    cancellable: false
  response_mapping:
    owner: function
    params:
      - id: source
        type:
          ref: source
          nullable: true
          reference: true
    results:
      - type:
          ref: target
    fallible: true
    cancellable: false
