version: 1
config_message: Config
representation:
  version: 1
  messages:
    APIKeyCredentials:
      fields:
        key: { sensitive: true }
    TokenPairCredentials:
      fields:
        id: { sensitive: true }
        secret: { sensitive: true }
    BearerTokenCredentials:
      fields:
        token: { sensitive: true }
    OAuthCredentials:
      fields:
        refresh_token: { sensitive: true }
        client_secret: { sensitive: true }
        jwt_key: { sensitive: true }
# Mirrors Protovalidate options on proto/kit/sandbox/v1/client.proto.
# secure_endpoint stays handwritten in each SDK (HTTPS or loopback HTTP).
validation:
  version: 1
  messages:
    Config:
      fields:
        endpoint: { nonblank: true, format: secure_endpoint }
        region: { nonblank: true }
        timeout: { minimum: 0 }
    AuthConfig:
      # Protovalidate rule id: auth_credentials_required (mapped to exactly_one).
      constraints:
        - { op: exactly_one, fields: [api_key, token_pair, bearer_token, oauth_refresh] }
    APIKeyCredentials:
      fields:
        key: { nonblank: true }
    TokenPairCredentials:
      fields:
        id: { nonblank: true }
        secret: { nonblank: true }
    BearerTokenCredentials:
      fields:
        token: { nonblank: true }
    OAuthCredentials:
      fields:
        refresh_token: { nonblank: true }
        client_id: { nonblank: true }
        client_secret: { nonblank: true }
        jwt_key: { nonblank: true }
      constraints:
        - { op: exactly_one, fields: [client_secret, jwt_key] }
    Scope:
      fields:
        app_name: { nonblank: true }
        environment: { nonblank: true }
        organization_id: { nonblank: true }
        project_id: { nonblank: true }
