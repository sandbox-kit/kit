version: 1
languages:
  go:
    targets:
      - source: kit/sandbox/v1/sandbox.proto
        output: sdks/go/sandbox
        module: github.com/sandbox-kit/kit/sdks/go/sandbox
      - source: kit/providers/modal/v1/provider.proto
        output: sdks/go/providers/modal
        module: github.com/sandbox-kit/kit/sdks/go/providers/modal
        provider: modal
      - source: kit/providers/daytona/v1/provider.proto
        output: sdks/go/providers/daytona
        module: github.com/sandbox-kit/kit/sdks/go/providers/daytona
        provider: daytona
  typescript:
    targets:
      - source: kit/providers/modal/v1/provider.proto
        output: sdks/typescript/providers/modal/src
        module: "@sandbox-kit/provider-modal"
        provider: modal
      - source: kit/providers/daytona/v1/provider.proto
        output: sdks/typescript/providers/daytona/src
        module: "@sandbox-kit/provider-daytona"
        provider: daytona
