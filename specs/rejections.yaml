# Shared create and client rejections. Go and TypeScript provider tests both
# load this file. kind and field are the portable result; messages may differ.
version: 1
cases:
  - name: daytona placement
    provider: daytona
    operation: create
    kind: unsupported
    field: placement
    create:
      placement:
        regions: [eu]
  - name: daytona idle terminate
    provider: daytona
    operation: create
    kind: unsupported
    field: lifetime.idle_terminate
    create:
      lifetime:
        idle_terminate:
          mode: disabled
  - name: daytona verbose
    provider: daytona
    operation: create
    kind: unsupported
    field: observability.verbose
    create:
      observability:
        verbose: true
  - name: daytona workload identity
    provider: daytona
    operation: create
    kind: unsupported
    field: security.workload_identity
    create:
      security:
        workload_identity: true
  - name: daytona runtime version
    provider: daytona
    operation: create
    kind: unsupported
    field: runtime
    create:
      runtime:
        version: "3.12"
  - name: daytona isolation class
    provider: daytona
    operation: create
    kind: unsupported
    field: isolation
    create:
      isolation:
        kind: container
  - name: daytona private network
    provider: daytona
    operation: create
    kind: unsupported
    field: network
    create:
      network:
        private_network: true
  - name: daytona maximum lifetime
    provider: daytona
    operation: create
    kind: invalid_argument
    field: lifetime.maximum_lifetime
    create:
      lifetime:
        maximum_lifetime_ms: 30000
  - name: daytona fractional create timeout
    provider: daytona
    operation: create
    kind: invalid_argument
    field: provisioning.timeout
    create:
      provisioning:
        timeout_ms: 1500
  - name: daytona cpu limit
    provider: daytona
    operation: create
    kind: unsupported
    field: resources
    create:
      source:
        image:
          reference: alpine:3.21
      resources:
        cpu_limit_cores: 2
  - name: daytona memory limit
    provider: daytona
    operation: create
    kind: unsupported
    field: resources
    create:
      source:
        image:
          reference: alpine:3.21
      resources:
        memory_limit_mib: 2048
  - name: daytona queue timeout
    provider: daytona
    operation: create
    kind: invalid_argument
    field: provisioning.queue_timeout
    create:
      provisioning:
        queue_timeout_ms: 30000
  - name: modal disk
    provider: modal
    operation: create
    kind: unsupported
    field: resources.disk_mib
    create:
      source:
        image:
          reference: alpine:3.21
      resources:
        disk_mib: 1024
  - name: modal placement target
    provider: modal
    operation: create
    kind: unsupported
    field: placement.target
    create:
      source:
        image:
          reference: alpine:3.21
      placement:
        target: us
  - name: modal queue timeout
    provider: modal
    operation: create
    kind: unsupported
    field: provisioning.queue_timeout
    create:
      source:
        image:
          reference: alpine:3.21
      provisioning:
        queue_timeout_ms: 60000
  - name: modal telemetry endpoint
    provider: modal
    operation: create
    kind: unsupported
    field: observability.telemetry_endpoint
    create:
      source:
        image:
          reference: alpine:3.21
      observability:
        telemetry_endpoint: https://otel.example
  - name: modal public access
    provider: modal
    operation: create
    kind: unsupported
    field: security.public_access
    create:
      source:
        image:
          reference: alpine:3.21
      security:
        public_access: true
  - name: modal linked sandbox
    provider: modal
    operation: create
    kind: unsupported
    field: network
    create:
      source:
        image:
          reference: alpine:3.21
      network:
        linked_sandbox: other
  - name: modal ephemeral lifetime
    provider: modal
    operation: create
    kind: unsupported
    field: lifetime
    create:
      source:
        image:
          reference: alpine:3.21
      lifetime:
        ephemeral: true
  - name: modal runtime language
    provider: modal
    operation: create
    kind: unsupported
    field: runtime
    create:
      source:
        image:
          reference: alpine:3.21
      runtime:
        language: python
  - name: modal nested virtualization
    provider: modal
    operation: create
    kind: unsupported
    field: isolation
    create:
      source:
        image:
          reference: alpine:3.21
      isolation:
        nested_virtualization: true
  - name: modal organization scope
    provider: modal
    operation: initialize
    kind: unsupported
    field: scope.organization_id
    config:
      scope:
        organization_id: org
  - name: modal project scope
    provider: modal
    operation: initialize
    kind: unsupported
    field: scope.project_id
    config:
      scope:
        project_id: project
