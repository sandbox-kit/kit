version: 1
# Semantic generation phases; language emitters own syntax and file conventions.
# Portable types and copies come from standard protobuf contracts plus handwritten
# runtime aliases. Shared generation keeps paths and validation helpers only.
shared: [diagnostic_paths, field_paths, validation]
# Client portable config types come from contracts; runtime aliases them by hand.
client: [diagnostic_paths, field_paths]
provider: [checks, mappings]
operations:
  initialize:
    - require_provider
    - identify_provider
    - validate_configuration
    - require_provider_name
    - capture_timeout
    - initialize_provider
    - require_backend
    - match_backend_identity
    - return_client
  create:
    - require_context
    - require_client
    - prepare_request
    - resolve_deadline
    - invoke_creation
    - return_handle
  close:
    - require_context
    - close_backend
  attach:
    [
      require_context,
      require_client,
      require_identity,
      resolve_deadline,
      require_capability,
      invoke_capability,
      return_handle,
    ]
  get:
    [
      require_context,
      require_client,
      require_identity,
      resolve_deadline,
      require_capability,
      invoke_capability,
      return_handle,
    ]
  refresh: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
  start: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
  stop: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
  pause: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
  terminate: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, return_result]
  archive: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
  delete: [require_context, require_handle, resolve_deadline, require_capability, invoke_capability, update_handle]
