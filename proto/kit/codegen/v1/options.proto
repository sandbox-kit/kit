syntax = "proto3";

package kit.codegen.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/sandbox-kit/kit/tooling/internal/gen/codegen/v1;codegenv1";

// ClientDeclaration describes a local SDK client, not an RPC service.
// These annotations are build-time metadata; SDK clients and credentials are
// ordinary language objects and are never serialized into these messages.
message ClientDeclaration {
  // Runtime declaration names now belong to specs/api.yaml.
  reserved 1, 2;
  reserved "name", "backend_interface";
  reserved "go_name", "go_provider_interface";
  // Removed the accessor that exposed a provider-specific public API.
  reserved 3;
  reserved "go_provider_accessor";
  // Optional local creation surface; SDK handle generation is language-specific.
  string creation_service = 4;
  // Native initialization settings; runtime provider factories are attached by emitters.
  string config_message = 5;
}

// ProviderDeclaration generates a typed, optionally installed provider integration.
message ProviderDeclaration {
  string provider_name = 1;
  // Runtime declaration names now belong to specs/api.yaml.
  reserved 2;
  reserved "name";
  // Constructor naming belongs to the language generator (New in Go).
  reserved 3;
  reserved "go_name", "go_constructor";
  // Retired SDK binding fields; language bindings now live in sdks.
  reserved 4, 5;
  reserved "go_sdk_import", "go_sdk_client_type";
  // The SDK client is an internal implementation detail of the adapter.
  reserved 6;
  reserved "go_sdk_accessor";
  map<string, TargetSDK> sdks = 7;
  reserved 8;
  reserved "creation_fields";
}
message TargetSDK { string import_path = 1; string client_type = 2; }

extend google.protobuf.FileOptions {
  ClientDeclaration client = 51000;
  ProviderDeclaration provider = 51001;
  // Generate ordinary target-language data types from this shared schema.
  bool native_types = 51003;
}

// Extension number 51002 belonged to the removed SDK-binding initialization
// generator. Keep it retired if these annotations are extended later.
