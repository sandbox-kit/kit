syntax = "proto3";

package kit.sandbox.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "kit/codegen/v1/options.proto";
import "kit/sandbox/v1/sandbox.proto";

option go_package = "github.com/sandbox-kit/kit/sdks/go/sandbox;sandbox";
option (kit.codegen.v1.client) = {
  creation_service: "SandboxService"
  config_message: "Config"
};

// is the shared client configuration. Provider is attached by the generator and is not serialized.
//
// Example:
//
//	client, err := NewClient(Config{
//	    Provider: provider,
//	    Timeout:  Value(2 * time.Minute),
//	})
message Config {
  // is one credential alternative. Nil lets the native SDK resolve its own environment or profile.
  AuthConfig auth = 1;
  // is the provider API URL where the integration supports an override.
  // HTTPS is required except for loopback HTTP; that secure_endpoint check stays handwritten.
  optional string endpoint = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is a region or target preference.
  optional string region = 3 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is the app, environment, organization, or project scope. JSON name is "context".
  Scope scope = 4 [json_name = "context"];
  // is the default Kit operation deadline. An explicit creation timeout overrides it.
  // Nil and explicit zero add no Kit deadline.
  google.protobuf.Duration timeout = 5 [(buf.validate.field).duration.gte = {}];
}
// holds exactly one credential alternative. When AuthConfig itself is set, one
// credential alternative is required. Omitting Config.auth still lets the
// provider SDK resolve credentials from the environment or a profile.
message AuthConfig {
  option (buf.validate.message) = {
    cel: [
      {
        id: "auth_credentials_required"
        message: "auth credentials are required when auth is supplied"
        expression: "has(this.api_key) || has(this.token_pair) || has(this.bearer_token) || has(this.oauth_refresh)"
      }
    ]
  };
  // is the selected credential.
  oneof credentials {
    APIKeyCredentials api_key = 1;
    TokenPairCredentials token_pair = 2;
    BearerTokenCredentials bearer_token = 3;
    OAuthCredentials oauth_refresh = 4;
  }
}
// is an API-key credential. Daytona uses Key.
message APIKeyCredentials {
  // is the secret API key. It is excluded from generated JSON.
  string key = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// is a token-id and token-secret pair. Modal uses both fields.
message TokenPairCredentials {
  // is the token identifier.
  string id = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is the token secret. It is excluded from generated JSON.
  string secret = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// is a bearer or JWT credential. Daytona also requires an organization.
message BearerTokenCredentials {
  // is the bearer token. It is excluded from generated JSON.
  string token = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// is an OAuth refresh credential. Supply ClientID and exactly one of ClientSecret or JWTKey.
message OAuthCredentials {
  option (buf.validate.message) = {
    cel: [
      {
        id: "exactly_one"
        message: "requires exactly one of client_secret, jwt_key"
        expression: "has(this.client_secret) != has(this.jwt_key)"
      }
    ]
  };
  // is the refresh token. It is excluded from generated JSON.
  string refresh_token = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is the OAuth client identifier.
  string client_id = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is one client secret. Do not set this together with JWTKey.
  optional string client_secret = 3 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is one JWT signing key. Do not set this together with ClientSecret.
  optional string jwt_key = 4 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// names the provider scope. Each provider accepts a subset of these fields.
message Scope {
  // is the Modal app name. The app must already exist.
  optional string app_name = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is the Modal environment. The example default is "main".
  optional string environment = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is the Daytona organization. Bearer auth requires it when the SDK cannot resolve one.
  optional string organization_id = 3 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // is reserved for providers that scope work to a project. Current providers reject it when supplied.
  optional string project_id = 4 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}

// Describes the complete local SDK contract for generation. No gRPC service is
// deployed: language emitters turn these methods into native Client and
// Sandbox-handle methods, while providers implement typed adapters.
service SandboxService {
  rpc Create(CreateOptions) returns (CreateResult) {
    option (kit.codegen.v1.operation) = {
      id: "create"
      outcome: "create_handle"
      adapter_interface: "sandbox_creator"
      adapter_method: "create"
    };
  }
  rpc Get(GetSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "get"
      outcome: "create_handle"
      adapter_interface: "sandbox_refresher"
      adapter_method: "refresh_sandbox"
    };
  }
  rpc Attach(AttachSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "attach"
      outcome: "create_handle"
      adapter_interface: "sandbox_attacher"
      adapter_method: "attach_sandbox"
    };
  }
  rpc Refresh(RefreshSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "refresh"
      capability: "refresh"
      handle: true
      outcome: "update_handle"
      adapter_interface: "sandbox_refresher"
      adapter_method: "refresh_sandbox"
    };
  }
  rpc Start(StartSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "start"
      capability: "start"
      handle: true
      options_message: "StartOptions"
      outcome: "update_handle"
      timeout: true
      adapter_interface: "sandbox_starter"
      adapter_method: "start_sandbox"
    };
  }
  rpc Stop(StopSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "stop"
      capability: "stop"
      handle: true
      options_message: "StopOptions"
      outcome: "update_handle"
      timeout: true
      adapter_interface: "sandbox_stopper"
      adapter_method: "stop_sandbox"
    };
  }
  rpc Pause(PauseSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "pause"
      capability: "pause"
      handle: true
      options_message: "PauseOptions"
      outcome: "update_handle"
      timeout: true
      adapter_interface: "sandbox_pauser"
      adapter_method: "pause_sandbox"
    };
  }
  rpc Terminate(TerminateSandboxRequest) returns (ExitResult) {
    option (kit.codegen.v1.operation) = {
      id: "terminate"
      capability: "terminate"
      handle: true
      options_message: "TerminateOptions"
      outcome: "exit_result"
      terminal_state: "terminated"
      timeout: true
      adapter_interface: "sandbox_terminator"
      adapter_method: "terminate_sandbox"
    };
  }
  rpc Archive(ArchiveSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "archive"
      capability: "archive"
      handle: true
      options_message: "ArchiveOptions"
      outcome: "update_handle"
      timeout: true
      adapter_interface: "sandbox_archiver"
      adapter_method: "archive_sandbox"
    };
  }
  rpc Delete(DeleteSandboxRequest) returns (SandboxInfo) {
    option (kit.codegen.v1.operation) = {
      id: "delete"
      capability: "delete"
      handle: true
      options_message: "DeleteOptions"
      outcome: "update_handle"
      terminal_state: "deleted"
      timeout: true
      adapter_interface: "sandbox_deleter"
      adapter_method: "delete_sandbox"
    };
  }
}

// References an existing provider sandbox. It is the shared input envelope for
// retrieval and lifecycle calls; native SDKs expose the ID through a Sandbox
// handle rather than forcing applications to construct this message.
message SandboxReference {
  string sandbox_id = 1;
}

message GetSandboxRequest {
  SandboxReference sandbox = 1;
}
message AttachSandboxRequest {
  SandboxReference sandbox = 1;
}
message RefreshSandboxRequest {
  SandboxReference sandbox = 1;
}
message StartSandboxRequest {
  SandboxReference sandbox = 1;
  StartOptions options = 2;
}
message StopSandboxRequest {
  SandboxReference sandbox = 1;
  StopOptions options = 2;
}
message PauseSandboxRequest {
  SandboxReference sandbox = 1;
  PauseOptions options = 2;
}
message TerminateSandboxRequest {
  SandboxReference sandbox = 1;
  TerminateOptions options = 2;
}
message ArchiveSandboxRequest {
  SandboxReference sandbox = 1;
  ArchiveOptions options = 2;
}
message DeleteSandboxRequest {
  SandboxReference sandbox = 1;
  DeleteOptions options = 2;
}
