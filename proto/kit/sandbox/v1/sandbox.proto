syntax = "proto3";
package kit.sandbox.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sandbox-kit/kit/sdks/go/internal/contracts/kit/sandbox/v1;sandboxv1";

// CreateOptions is the creation request. It does not include lifecycle operations or credentials.
// Omitted fields use provider defaults. A provider rejects settings it cannot honor.
//
// Example:
//
//	cpu := 0.5
//	memory := uint64(512)
//	options := &CreateOptions{
//	    Resources: &Resources{CpuCores: &cpu, MemoryMib: &memory},
//	}
message CreateOptions {
  // An optional display name. Nil uses the provider default. An explicit empty string asks for an unnamed sandbox.
  optional string name = 1;
  // selects an image, snapshot, warm pool, or the provider default. Nil means the provider default.
  SandboxSource source = 2;
  // sets language, user, working directory, and entrypoint hints.
  RuntimeConfig runtime = 3;
  // selects the isolation class, such as a container or Linux VM.
  IsolationConfig isolation = 4;
  // sets CPU, memory, and disk. Units are physical cores and MiB.
  Resources resources = 5;
  // sets cloud and region preferences. A preference is not a scheduling guarantee.
  Placement placement = 6;
  // The process environment. An empty map is explicit; nil means omitted.
  map<string, string> environment = 7;
  // Caller-supplied labels or tags. An empty map is explicit; nil means omitted.
  map<string, string> labels = 8;
  // sets egress, allowlists, ports, and related network options.
  NetworkConfig network = 9;
  // sets public access, workload identity, and secret references.
  SecurityConfig security = 10;
  // sets lifetime and idle policies requested at creation. These are not stop or delete calls.
  LifetimePolicy lifetime = 11;
  // sets the creation deadline, queue timeout, and wait condition. JSON name is "creation".
  ProvisioningOptions provisioning = 12 [json_name = "creation"];
  ReadinessProbe readiness = 13;
  ObservabilityConfig observability = 14;
  reserved 15;
  reserved "provider_options";
}

// SandboxSource is the sandbox source. Set one alternative. Nil means the provider default, which need not be an image.
message SandboxSource {
  // The selected source. Leaving it unset also means the provider default, which need not be an image.
  oneof kind {
    ProviderDefaultSource provider_default = 1;
    ImageSource image = 2;
    SnapshotSource snapshot = 3;
    WarmPoolSource warm_pool = 4;
  }
}
// ProviderDefaultSource asks the provider to choose its default source.
message ProviderDefaultSource {}
// ImageSource is a container image reference, such as "alpine:3.21".
message ImageSource {
  // The registry image reference.
  string reference = 1 [(buf.validate.field) = {
    cel: [
      {
        id: "nonblank"
        message: "must not be blank"
        expression: "this.trim() != ''"
      },
      {
        id: "image_reference"
        message: "must be a container image reference"
        expression: "this.size() <= 512 && this.matches('^(?:[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]+)?/)?[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*(?::[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(?:@sha256:[a-fA-F0-9]{64})?$')"
      }
    ]
  }];
}
// SnapshotSource is an existing snapshot. Reference identifies it. Kind classifies it.
message SnapshotSource {
  // The provider snapshot identifier.
  string reference = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // classifies the snapshot. Default leaves the class to the provider.
  SnapshotKind kind = 2 [(buf.validate.field).enum.defined_only = true];
  // A provider-specific kind name when Kind is provider-specific.
  optional string provider_kind = 3;
}
// WarmPoolSource is an existing warm pool. Reference identifies it.
message WarmPoolSource {
  // The provider warm-pool identifier.
  string reference = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// SnapshotKind classifies a snapshot. Preserve the numeric values.
enum SnapshotKind {
  SNAPSHOT_KIND_DEFAULT = 0;
  SNAPSHOT_KIND_FILESYSTEM = 1;
  SNAPSHOT_KIND_MEMORY = 2;
  SNAPSHOT_KIND_IMAGE = 3;
  SNAPSHOT_KIND_MACHINE = 4;
  SNAPSHOT_KIND_CHECKPOINT = 5;
  SNAPSHOT_KIND_PROVIDER_SPECIFIC = 6;
}
// RuntimeConfig is process setup applied when the sandbox starts. Language is a hint, not an install promise.
message RuntimeConfig {
  // A language or toolbox hint. It does not promise that a runtime is installed.
  optional string language = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  optional string version = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  optional string user = 3 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  optional string working_directory = 4 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  repeated string entrypoint = 5 [(buf.validate.field).repeated.items.cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  optional bool pty = 6;
}
// IsolationConfig selects how the sandbox is isolated. Kind default leaves the class to the provider.
message IsolationConfig {
  IsolationKind kind = 1 [(buf.validate.field).enum.defined_only = true];
  optional string provider_kind = 2;
  optional bool nested_virtualization = 3;
}
// IsolationKind is the isolation class. Preserve the numeric values.
enum IsolationKind {
  ISOLATION_KIND_DEFAULT = 0;
  ISOLATION_KIND_CONTAINER = 1;
  ISOLATION_KIND_MICROVM = 2;
  ISOLATION_KIND_LINUX_VM = 3;
  ISOLATION_KIND_WORKER = 4;
  ISOLATION_KIND_PROVIDER_SPECIFIC = 5;
}
// Resources is the requested compute size. Omitted fields use provider defaults.
// GPU requests and resizing are not creation settings.
message Resources {
  option (buf.validate.message) = {
    cel: [
      {
        id: "cpu_limit"
        message: "cpu_limit_cores must be at least cpu_cores when the limit is positive"
        expression: "!has(this.cpu_limit_cores) || this.cpu_limit_cores <= 0.0 || !has(this.cpu_cores) || this.cpu_limit_cores >= this.cpu_cores"
      },
      {
        id: "memory_limit"
        message: "memory_limit_mib must be at least memory_mib when the limit is positive"
        expression: "!has(this.memory_limit_mib) || this.memory_limit_mib == 0u || !has(this.memory_mib) || this.memory_limit_mib >= this.memory_mib"
      },
      {
        id: "cpu_requires_positive"
        message: "a positive cpu_limit_cores requires a positive cpu_cores request"
        expression: "!has(this.cpu_limit_cores) || this.cpu_limit_cores <= 0.0 || (has(this.cpu_cores) && this.cpu_cores > 0.0)"
      },
      {
        id: "memory_requires_positive"
        message: "a positive memory_limit_mib requires a positive memory_mib request"
        expression: "!has(this.memory_limit_mib) || this.memory_limit_mib == 0u || (has(this.memory_mib) && this.memory_mib > 0u)"
      }
    ]
  };
  // The requested physical CPU count. Modal allows fractions. Daytona requires whole cores.
  optional double cpu_cores = 1 [(buf.validate.field) = {
    cel: [
      {
        id: "finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      },
      {
        id: "exclusive_minimum"
        message: "must be greater than 0"
        expression: "this > 0.0"
      }
    ]
  }];
  // An optional CPU ceiling. A positive limit requires a request and cannot be smaller than it.
  optional double cpu_limit_cores = 2 [(buf.validate.field) = {
    cel: [
      {
        id: "finite"
        message: "must be finite"
        expression: "!this.isNan() && !this.isInf()"
      },
      {
        id: "minimum"
        message: "must be at least 0"
        expression: "this >= 0.0"
      }
    ]
  }];
  // Requested memory in MiB. Providers convert this to the native unit.
  optional uint64 memory_mib = 3 [(buf.validate.field).cel = {
    id: "exclusive_minimum"
    message: "must be greater than 0"
    expression: "this > 0u"
  }];
  // An optional memory ceiling in MiB. A positive limit requires a request.
  optional uint64 memory_limit_mib = 4;
  // Requested disk in MiB. Modal rejects a creation override. Daytona requires whole GiB.
  optional uint64 disk_mib = 5 [(buf.validate.field).cel = {
    id: "exclusive_minimum"
    message: "must be greater than 0"
    expression: "this > 0u"
  }];
}
// Placement is a placement preference. The provider may still choose another location.
message Placement {
  // A cloud name such as aws, gcp, or oci. Supported names depend on the provider.
  optional string cloud = 1;
  // lists region preferences in order. It does not promise multi-region support.
  repeated string regions = 2 [(buf.validate.field).repeated.items.cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // A provider target. Daytona maps the client region here. Per-request placement is unsupported.
  optional string target = 3;
}
// StringAllowlist is an allowlist. A present empty list means deny all. Nil means the list was omitted.
message StringAllowlist {
  // lists allowed values. A present empty list means deny all. Nil means the list was omitted.
  repeated string entries = 1;
}
// NetworkConfig is creation-time networking. Empty allowlists do not mean the same thing as omitted ones.
message NetworkConfig {
  option (buf.validate.message) = {
    cel: [
      {
        id: "restricted_requires_allowlist"
        message: "restricted egress requires outbound_cidrs or outbound_domains"
        expression: "this.egress != 3 || has(this.outbound_cidrs) || has(this.outbound_domains)"
      },
      {
        id: "block_all_forbids_network"
        message: "block-all egress forbids networking allowlists, links, and ports"
        expression: "this.egress != 2 || (!has(this.outbound_cidrs) && !has(this.outbound_domains) && !has(this.inbound_cidrs) && !has(this.linked_sandbox) && this.ports.size() == 0 && (!has(this.private_network) || !this.private_network))"
      },
      {
        id: "allow_all_forbids_allowlists"
        message: "allow-all egress forbids outbound allowlists"
        expression: "this.egress != 1 || (!has(this.outbound_cidrs) && !has(this.outbound_domains))"
      }
    ]
  };
  // selects the outbound policy. Default leaves it to the provider.
  EgressMode egress = 1 [(buf.validate.field).enum.defined_only = true];
  // limits outbound traffic to these CIDR ranges.
  StringAllowlist outbound_cidrs = 2;
  // limits outbound traffic to these domains.
  StringAllowlist outbound_domains = 3;
  // limits inbound traffic to these CIDR ranges.
  StringAllowlist inbound_cidrs = 4;
  // asks for a private network when the provider supports one.
  optional bool private_network = 5;
  // names another sandbox to link. The provider must already know that sandbox.
  optional string linked_sandbox = 6 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // names a provider-managed proxy.
  optional string proxy_reference = 7 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // An outbound proxy URL.
  optional string outbound_proxy_url = 8;
  // A custom domain for the sandbox, when the provider supports one.
  optional string custom_domain = 9;
  // publishes these ports.
  repeated PortBinding ports = 10;
}
// EgressMode controls outbound traffic. Default leaves the policy to the provider.
enum EgressMode {
  EGRESS_MODE_DEFAULT = 0;
  EGRESS_MODE_ALLOW_ALL = 1;
  // blocks all networking, including private connections.
  EGRESS_MODE_BLOCK_ALL = 2;
  EGRESS_MODE_RESTRICTED = 3;
}
// PortBinding publishes one port. Port is the container port. Transport selects the protocol.
message PortBinding {
  // The port number to publish. Zero leaves the port to the provider; otherwise 1-65535.
  uint32 port = 1 [(buf.validate.field).cel = {
    id: "maximum"
    message: "must be at most 65535"
    expression: "this <= 65535u"
  }];
  // selects TLS, HTTP/2, or plain transport. Default leaves the choice to the provider.
  PortTransport transport = 2 [(buf.validate.field).enum.defined_only = true];
}
// PortTransport is the protocol used for a published port.
enum PortTransport {
  PORT_TRANSPORT_DEFAULT = 0;
  PORT_TRANSPORT_TLS = 1;
  PORT_TRANSPORT_HTTP2_TLS = 2;
  PORT_TRANSPORT_PLAIN = 3;
}
// SecurityConfig sets access and secret references. Secrets are provider-managed names, not credential values.
message SecurityConfig {
  // requests public access when true. Nil leaves the provider default.
  optional bool public_access = 1;
  // requests a workload identity when the provider supports one.
  optional bool workload_identity = 2;
  // names provider-managed secrets. These are not credential values.
  repeated SecretReference secrets = 3;
}
// SecretReference names a provider-managed secret and how it is injected.
message SecretReference {
  // The provider secret name.
  string reference = 1 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // The environment variable that receives the secret, when injection uses the environment.
  optional string environment_variable = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
  // selects environment injection or an egress placeholder.
  SecretInjection injection = 3 [(buf.validate.field).enum.defined_only = true];
}
// SecretInjection selects how a secret is exposed to the sandbox.
enum SecretInjection {
  SECRET_INJECTION_DEFAULT = 0;
  SECRET_INJECTION_ENVIRONMENT = 1;
  SECRET_INJECTION_EGRESS_PLACEHOLDER = 2;
}
// LifetimePolicy is requested at creation. It is not a stop, pause, or delete call.
message LifetimePolicy {
  // The maximum lifetime. Nil uses the provider default. Explicit zero means unlimited when the provider supports that.
  google.protobuf.Duration maximum_lifetime = 1 [(buf.validate.field).duration.gte = {}];
  // requests deletion when the sandbox stops, where the provider supports it.
  optional bool ephemeral = 2;
  // ends the sandbox after it is idle.
  AutomaticAction idle_terminate = 3;
  // stops the sandbox after it is idle. Daytona maps a disabled stop to native zero.
  AutomaticAction idle_stop = 4;
  // pauses the sandbox after it is idle. A positive delay conflicts with a positive stop delay.
  AutomaticAction idle_pause = 5;
  // archives a stopped sandbox after a delay. Daytona rejects disable and immediate archive.
  AutomaticAction stopped_archive = 6;
  // deletes a stopped sandbox. Daytona maps immediate delete to native zero.
  AutomaticAction stopped_delete = 7;
}
// AutomaticAction is one idle or stopped policy. Disabled, immediate, and delayed do not share one zero value.
message AutomaticAction {
  option (buf.validate.message) = {
    cel: [
      {
        id: "after_requires_duration"
        message: "mode after requires after"
        expression: "this.mode != 2 || has(this.after)"
      },
      {
        id: "after_forbids_duration"
        message: "after is only set when mode is after"
        expression: "this.mode == 2 || !has(this.after)"
      }
    ]
  };
  // Default, disabled, or after a delay. Default omits the policy.
  PolicyMode mode = 1 [(buf.validate.field).enum.defined_only = true];
  // The delay used when Mode is after. Zero means immediate, not disabled.
  google.protobuf.Duration after = 2 [(buf.validate.field).duration.gte = {}];
}
// PolicyMode selects whether an automatic action is omitted, disabled, or delayed.
enum PolicyMode {
  POLICY_MODE_DEFAULT = 0;
  POLICY_MODE_DISABLED = 1;
  POLICY_MODE_AFTER = 2;
}
// ProvisioningOptions is creation waiting, separate from sandbox lifetime.
message ProvisioningOptions {
  // The client operation deadline, distinct from sandbox lifetime and queue time.
  // Nil and explicit zero add no Kit deadline.
  google.protobuf.Duration timeout = 1 [(buf.validate.field).duration.gte = {}];
  // How long creation may wait in a provider queue. It is not the sandbox lifetime.
  google.protobuf.Duration queue_timeout = 2 [(buf.validate.field).duration.gte = {}];
  // The condition creation waits for before it returns.
  WaitCondition wait_for = 3 [(buf.validate.field).enum.defined_only = true];
}
// WaitCondition is how far creation waits before returning. Ready can require a probe and a positive timeout.
enum WaitCondition {
  WAIT_CONDITION_DEFAULT = 0;
  WAIT_CONDITION_SUBMITTED = 1;
  WAIT_CONDITION_SCHEDULED = 2;
  WAIT_CONDITION_STARTED = 3;
  WAIT_CONDITION_READY = 4;
}
// ReadinessProbe is the check used when waiting until ready. Set either a TCP port or a command.
message ReadinessProbe {
  oneof check {
    option (buf.validate.oneof).required = true;
    uint32 tcp_port = 1 [(buf.validate.field) = {
      cel: [
        {
          id: "minimum"
          message: "must be at least 1"
          expression: "this >= 1u"
        },
        {
          id: "maximum"
          message: "must be at most 65535"
          expression: "this <= 65535u"
        }
      ]
    }];
    CommandProbe command = 2;
  }
}
// CommandProbe is a command readiness check. Argv is the command and its arguments.
message CommandProbe {
  repeated string argv = 1 [(buf.validate.field).cel = {
    id: "min_items"
    message: "must contain at least one argument"
    expression: "this.size() >= 1"
  }];
}
// ObservabilityConfig sets provider logging and telemetry options.
message ObservabilityConfig {
  optional bool verbose = 1;
  optional string telemetry_endpoint = 2 [(buf.validate.field).cel = {
    id: "nonblank"
    message: "must not be blank"
    expression: "this.trim() != ''"
  }];
}
// CreateResult is the metadata returned by a provider create call.
message CreateResult {
  // The created sandbox. ID must be present before a public handle is built.
  SandboxInfo sandbox = 1;
}

// StartOptions configures starting a persistent sandbox. Nil timeout inherits Config.Timeout.
message StartOptions {
  google.protobuf.Duration timeout = 1;
}

// StopOptions configures a restartable stop. Force requests an immediate provider-native stop.
message StopOptions {
  google.protobuf.Duration timeout = 1;
  optional bool force = 2;
}

// PauseOptions configures a memory-preserving pause. Nil timeout inherits Config.Timeout.
message PauseOptions {
  google.protobuf.Duration timeout = 1;
}

// TerminateOptions configures permanent completion of the current execution.
message TerminateOptions {
  google.protobuf.Duration timeout = 1;
  optional bool wait = 2;
}

// ArchiveOptions configures moving retained sandbox state to provider archive storage.
message ArchiveOptions {
  google.protobuf.Duration timeout = 1;
}

// DeleteOptions configures irreversible sandbox deletion.
message DeleteOptions {
  google.protobuf.Duration timeout = 1;
  optional bool wait = 2;
}

// ExitResult is the result of permanently completing an execution.
message ExitResult {
  optional int32 exit_code = 1;
}
// SandboxState is a portable lifecycle state. ProviderState retains the native value.
enum SandboxState {
  SANDBOX_STATE_UNKNOWN = 0;
  SANDBOX_STATE_QUEUED = 1;
  SANDBOX_STATE_STARTING = 2;
  SANDBOX_STATE_RUNNING = 3;
  SANDBOX_STATE_STOPPING = 4;
  SANDBOX_STATE_STOPPED = 5;
  SANDBOX_STATE_PAUSING = 6;
  SANDBOX_STATE_PAUSED = 7;
  SANDBOX_STATE_ARCHIVING = 8;
  SANDBOX_STATE_ARCHIVED = 9;
  SANDBOX_STATE_TERMINATING = 10;
  SANDBOX_STATE_TERMINATED = 11;
  SANDBOX_STATE_DELETING = 12;
  SANDBOX_STATE_DELETED = 13;
  SANDBOX_STATE_ERROR = 14;
}
// LifecycleCapability identifies a lifecycle operation a provider implements.
enum LifecycleCapability {
  LIFECYCLE_CAPABILITY_UNKNOWN = 0;
  LIFECYCLE_CAPABILITY_REFRESH = 1;
  LIFECYCLE_CAPABILITY_START = 2;
  LIFECYCLE_CAPABILITY_STOP = 3;
  LIFECYCLE_CAPABILITY_PAUSE = 4;
  LIFECYCLE_CAPABILITY_TERMINATE = 5;
  LIFECYCLE_CAPABILITY_ARCHIVE = 6;
  LIFECYCLE_CAPABILITY_DELETE = 7;
}
// SandboxInfo is shared metadata. Optional fields stay absent when the provider did not report them.
//
// Example:
//
//	info := &SandboxInfo{Id: "sb-1"}
//	fmt.Println(info.GetId())
message SandboxInfo {
  // The provider sandbox identifier. Creation fails locally when it is empty.
  string id = 1;
  // The selected provider identifier.
  string provider = 2;
  // The sandbox name when one is known. Nil means it was not reported.
  optional string name = 3;
  // The provider's own state string. It is not a shared lifecycle state machine.
  optional string provider_state = 4;
  optional string region = 5;
  IsolationConfig isolation = 6;
  Resources resources = 7;
  map<string, string> labels = 8;
  google.protobuf.Timestamp created_at = 9;
  MetadataObject provider_metadata = 10;
  reserved 11;
  reserved "origins";
  // The normalized lifecycle state when Kit can map the provider state.
  SandboxState state = 12;
  // reports that execution/resource lifecycle is permanently complete.
  optional bool terminal = 13;
}
// ErrorKind is the shared error category. It does not imply that a retry is safe.
enum ErrorKind {
  ERROR_KIND_UNKNOWN = 0;
  ERROR_KIND_INVALID_ARGUMENT = 1;
  ERROR_KIND_UNSUPPORTED = 2;
  ERROR_KIND_AUTHENTICATION = 3;
  ERROR_KIND_PERMISSION_DENIED = 4;
  ERROR_KIND_NOT_FOUND = 5;
  ERROR_KIND_ALREADY_EXISTS = 6;
  ERROR_KIND_CONFLICT = 7;
  ERROR_KIND_RATE_LIMITED = 8;
  ERROR_KIND_RESOURCE_EXHAUSTED = 9;
  ERROR_KIND_TIMEOUT = 10;
  ERROR_KIND_CANCELED = 11;
  ERROR_KIND_UNAVAILABLE = 12;
  ERROR_KIND_INVALID_RESPONSE = 13;
  ERROR_KIND_INTERNAL = 14;
  ERROR_KIND_FAILED_PRECONDITION = 15;
}
// ErrorInfo is the portable error detail. The native cause stays on the runtime error and is not serialized.
// Unknown classifications do not imply that a retry is safe.
//
// Example:
//
//	info := &ErrorInfo{
//	    Kind:    ErrorKind_ERROR_KIND_UNSUPPORTED,
//	    Field:   "resources.disk_mib",
//	    Message: "disk overrides are unsupported",
//	}
message ErrorInfo {
  // The shared category, such as invalid argument or unsupported.
  ErrorKind kind = 1;
  // The provider identifier, such as "modal" or "daytona". Empty when the failure is local.
  string provider = 2;
  // The Kit operation, such as "create", "initialize", or "close".
  string operation = 3;
  // The canonical field path involved, such as "resources.cpu_cores". Empty when no field applies.
  string field = 4;
  // The human-readable explanation.
  string message = 5;
  // The native HTTP or transport status when the provider reported one.
  optional uint32 status_code = 6;
  // The provider's own error code when one was reported.
  optional string provider_code = 7;
  // The provider component that reported the error, when available.
  optional string provider_source = 8;
  // A stable portable validation or policy rule identifier, when applicable.
  optional string rule = 9;
}
// Exact numeric alternatives avoid protobuf Struct's double-only representation.
// An empty value represents null.
message MetadataValue {
  oneof value {
    bool boolean = 1;
    string text = 2;
    int64 signed_integer = 3;
    uint64 unsigned_integer = 4;
    double number = 5;
    bytes binary = 6;
    MetadataList list = 7;
    MetadataObject object = 8;
  }
}
// MetadataList is an ordered list of metadata values.
message MetadataList {
  // The list contents. An empty list is explicit.
  repeated MetadataValue values = 1;
}
// MetadataObject is a string-keyed metadata object. Adapters fill values directly.
message MetadataObject {
  // The object contents. An empty object is explicit.
  map<string, MetadataValue> values = 1;
}
