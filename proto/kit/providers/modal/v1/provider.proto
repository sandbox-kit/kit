syntax = "proto3";

package kit.providers.modal.v1;

import public "kit/sandbox/v1/client.proto";
import "kit/codegen/v1/options.proto";

option go_package = "github.com/sandbox-kit/kit/sdks/go/providers/modal;modal";

option (kit.codegen.v1.provider) = {
  provider_name: "modal"
  name: "Backend"
  sdks: { key: "go" value: { import_path: "github.com/modal-labs/modal-client/go" client_type: "Client" } }
};
