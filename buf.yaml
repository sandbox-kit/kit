version: v2
modules:
  - path: proto
deps:
  # Protovalidate annotations (buf/validate/validate.proto). Resolved via the
  # Buf Schema Registry — no vendored copy under proto/.
  - buf.build/bufbuild/protovalidate
lint:
  # BASIC catches structural and naming mistakes without forcing public API
  # renames such as DEFAULT to UNSPECIFIED.
  use:
    - BASIC
  except:
    # Provider descriptor entrypoints intentionally re-export the shared client
    # graph so custom plugins receive it in the same generation request.
    - IMPORT_NO_PUBLIC
breaking:
  use:
    - FILE
