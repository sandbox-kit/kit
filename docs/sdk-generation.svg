<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="850" viewBox="0 0 1070 850"><g font-family="Comic Sans MS, cursive" fill="#333333"><text x="35" y="48.0" font-size="28">SDK contracts and runtime</text><rect x="35" y="85" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="55" y="131.0" font-size="23">1. Protobuf</text><text x="55" y="182.0" font-size="17">Shared portable contracts.</text><text x="55" y="204.1" font-size="17">Types, units, optional values.</text><text x="55" y="226.2" font-size="17"></text><text x="55" y="248.3" font-size="17">e.g. memory_mib</text><rect x="380" y="85" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="400" y="131.0" font-size="23">2. Specs</text><text x="400" y="182.0" font-size="17">YAML inventories for humans.</text><text x="400" y="204.1" font-size="17">Validation + provider mappings.</text><text x="400" y="226.2" font-size="17"></text><text x="400" y="248.3" font-size="17">Keep aligned with SDK code.</text><rect x="725" y="85" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="745" y="131.0" font-size="23">3. Contract plugins</text><text x="745" y="182.0" font-size="17">Standard protobuf plugins.</text><text x="745" y="204.1" font-size="17">Emit messages and enums.</text><text x="745" y="226.2" font-size="17"></text><text x="745" y="248.3" font-size="17">Output: sdks/*/contracts/</text><rect x="35" y="430" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="55" y="476.0" font-size="23">4. Handwritten runtime</text><text x="55" y="527.0" font-size="17">Client, validation, checks.</text><text x="55" y="549.1" font-size="17">Mappings and error wrappers.</text><text x="55" y="571.2" font-size="17"></text><text x="55" y="593.3" font-size="17">Aliases portable contracts.</text><rect x="380" y="430" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="400" y="476.0" font-size="23">5. Provider integration</text><text x="400" y="527.0" font-size="17">Connects to the official SDK.</text><text x="400" y="549.1" font-size="17">Handles provider workflows.</text><text x="400" y="571.2" font-size="17"></text><text x="400" y="593.3" font-size="17">App + image lookup, creation.</text><rect x="725" y="430" width="315" height="315" fill="none" stroke="#333333" stroke-width="1.3"/><text x="745" y="476.0" font-size="23">6. Generate + test</text><text x="745" y="527.0" font-size="17">Edit proto, regenerate.</text><text x="745" y="549.1" font-size="17">Then test SDKs + examples.</text><text x="745" y="571.2" font-size="17"></text><text x="745" y="593.3" font-size="17">Runtime lives in sdks/.</text><text x="35" y="817.0" font-size="17">From tooling/: generate contracts-*, then test go / typescript (via sandbox-kit).</text></g></svg>
